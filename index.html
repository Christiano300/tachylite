<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="/app/assets/main.css" />
    <? if ($URL.pathname.startsWith("/config")) { ?>
    <title>Tachylite Config</title>
    <? } else { ?>
    <title>Tachylite</title>
    <? } ?>
  </head>
  <body>
    <? if ($URL.pathname.startsWith("/config")) { ?>
    <header class="topbar">
      <a href="/" class="brand">Tachylite</a>
      <nav>
        <a href="/config">Config</a>
      </nav>
    </header>
    <main class="panel">
      <section class="panel">
        <h1>Configuration</h1>
        <p>Save WebDAV and content settings for your markdown site.</p>
        <form id="config-form" class="form">
          <label>
            WebDAV URL
            <input type="url" name="davUrl" placeholder="https://dav.example.com/remote.php/dav/files/user" required />
          </label>
          <label>
            Username
            <input type="text" name="davUsername" placeholder="username" required />
          </label>
          <label>
            Password
            <input type="password" name="davPassword" placeholder="password" required />
          </label>
          <button type="submit">Save</button>
        </form>
        <p class="hint">Config persistence endpoint is up to your server route implementation.</p>
      </section>
    </main>
    <script type="module" src="/app/config.ts"></script>
    <? } else { ?>
    <script server>
      const apiURL = new URL("/api/content", $URL);
      apiURL.searchParams.set("path", $URL.pathname);

      const content = await fetch(apiURL)
        .then((response) => {
          if (!response.ok) {
            throw new Error(`Failed to render markdown for ${$URL.pathname}`);
          }
          return response.json();
        })
        .catch(() => ({
          html: `<h1>Render failed</h1><p>Could not load markdown for ${$URL.pathname}</p>`,
        }));
    </script>
    <header class="topbar">
      <a href="/" class="brand">Tachylite</a>
      <nav>
        <a href="/config">Config</a>
      </nav>
    </header>
    <main id="markdown-root" class="panel"><?= content.html ?></main>
    <script type="module" src="/app/main.ts"></script>
    <? } ?>
  </body>
</html>
